name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - name: Install dependencies
        working-directory: cli
        run: npm ci
      - name: Show runtime versions
        working-directory: cli
        run: node --version && npm --version
      - name: TypeScript typecheck
        working-directory: cli
        run: npm run typecheck
      - name: JavaScript lint
        working-directory: cli
        run: node scripts/check-javascript.mjs
      - name: Test suite
        working-directory: cli
        run: |
          set -o pipefail
          npm run build 2>&1 | tee test-output.log
          failed=0
          for test_file in dist/tests/*.test.js; do
            printf '\n[test] %s\n' "$test_file" | tee -a test-output.log
            if ! node --test --test-concurrency=1 "$test_file" 2>&1 | tee -a test-output.log; then
              failed=1
            fi
          done
          exit "$failed"
      - name: Publish test output
        if: always()
        working-directory: cli
        run: |
          if [ -f test-output.log ]; then
            sed -n '1,400p' test-output.log
            {
              echo '## CI test output'
              echo '```text'
              sed -n '1,400p' test-output.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            line=0
            while IFS= read -r output_line && [ "$line" -lt 80 ]; do
              line=$((line + 1))
              escaped_line=$(printf '%s' "$output_line" | tr '%' '_' | tr '\r\n' '  ')
              echo "::error file=cli/test-output.log,line=$line,title=CI test output::$escaped_line"
            done < test-output.log
          fi
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-test-output
          path: cli/test-output.log
          if-no-files-found: warn
      - name: Documentation links
        working-directory: cli
        run: npm run docs:check
